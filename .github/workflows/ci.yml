name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Check shell scripts
        run: bash -n scripts/build-native.sh scripts/entrypoint.sh
      - name: Check dashboard JSON
        run: python3 -m json.tool grafana/autoware-exporter.json > /dev/null
      - name: Check compatibility helpers
        run: python3 -m py_compile tests/compatibility/prepare_interfaces.py tests/compatibility/publish.py
      - name: Test release tooling
        run: python3 -m unittest discover -s ci

  preview:
    name: Native release preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify reproducible native release preview
        run: python3 ci/release.py --snapshot --ros-distro jazzy --arch amd64 --verify-reproducible
      - name: Upload release preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preview
          path: dist/preview/
          if-no-files-found: error

  compatibility:
    name: ROS ${{ matrix.ros }} / Universe ${{ matrix.autoware }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ros: [humble, jazzy]
        autoware: ["0.51", "0.52", "0.53"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned Autoware message environment and exporter
        run: |
          docker build --build-arg ROS_DISTRO=${{ matrix.ros }} \
            --build-arg AUTOWARE_BRANCH=${{ matrix.autoware }} \
            -f tests/compatibility/Dockerfile -t autoware-exporter-compatibility .
      - name: Test native transport, real Autoware messages and exported metrics
        run: |
          docker run --rm --network none autoware-exporter-compatibility
